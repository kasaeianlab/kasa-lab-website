<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KASA Lab Admin</title><link rel="stylesheet" href="../styles.css"></head><body><main style="max-width:900px;margin:70px auto;padding:24px"><h1>KASA Lab Admin</h1><p id="state">Checking your session…</p><button id="logout" hidden>Sign out</button></main><script>
(async()=>{const r=await fetch('/api/admin/auth/me',{credentials:'same-origin',cache:'no-store'});if(!r.ok){location.replace('/admin/');return}const d=await r.json();document.getElementById('state').textContent='Signed in as '+d.email+'. The project-management dashboard will be added in the next stage.';document.getElementById('logout').hidden=false})();
document.getElementById('logout').addEventListener('click',async()=>{await fetch('/api/admin/auth/logout',{method:'POST',credentials:'same-origin'});location.replace('/admin/')});
</script></body></html>
